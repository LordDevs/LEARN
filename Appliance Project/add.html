<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Add Appliance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <h2 class="text-center mb-4">Register New Appliance</h2>
    <form action="add.php" method="POST" class="border p-4 rounded bg-white shadow">

        <h5 class="mb-3">User Information</h5>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" name="firstName" id="firstName" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">Last name</label>
                <input type="text" name="lastName" id="lastName" class="form-control" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">adress</label>
            <input type="text" name="address" id="address" class="form-control">
        </div>
        <div class="mb-3">
            <label for="mobile" class="form-label">phone</label>
            <input type="text" name="mobile" id="mobile" class="form-control">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" name="email" id="email" class="form-control">
        </div>
        <div class="mb-4">
            <label for="eircode" class="form-label">Eircode</label>
            <input type="text" name="eircode" id="eircode" class="form-control">
        </div>

        <h5 class="mb-3">Appliance Information</h5>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="applianceType" class="form-label">Type</label>
                <input type="text" name="applianceType" id="applianceType" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="brand" class="form-label">Brand</label>
                <input type="text" name="brand" id="brand" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="modelNumber" class="form-label">Model</label>
                <input type="text" name="modelNumber" id="modelNumber" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label for="serialNumber" class="form-label">Serial number</label>
                <input type="text" name="serialNumber" id="serialNumber" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="purchaseDate" class="form-label">Purchase Date</label>
                <input type="date" name="purchaseDate" id="purchaseDate" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label for="warrantyExpirationDate" class="form-label">Warranty Expiration</label>
                <input type="date" name="warrantyExpirationDate" id="warrantyExpirationDate" class="form-control">
            </div>
        </div>
        <div class="mb-4">
            <label for="cost" class="form-label">cost (€)</label>
            <input type="number" name="cost" id="cost" step="0.01" class="form-control">
        </div>

        <!-- Botão oculto para identificar ação no PHP -->
        <input type="hidden" name="add" value="1">

        <div class="text-center">
            <button type="submit" class="btn btn-success px-4">add</button>
            <a href="index.html" class="btn btn-secondary px-4">back</a>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

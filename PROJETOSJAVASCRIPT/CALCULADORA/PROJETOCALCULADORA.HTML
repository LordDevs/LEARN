<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="bg-body-tertiary border-bottom shadow-sm">
      <div class="container py-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
        <h1 class="h3 mb-0">Calculadora</h1>
        <button
          id="theme-toggle"
          class="btn btn-outline-primary d-inline-flex align-items-center gap-2"
          type="button"
          aria-pressed="false"
          aria-label="Alternar entre tema claro e escuro"
        >
          <span class="theme-toggle__icon" aria-hidden="true">🌞</span>
          <span class="theme-toggle__label">Tema: Claro</span>
        </button>
      </div>
    </header>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <section class="calculator card shadow border-0 p-4" aria-label="Calculadora">
            <div class="mb-4">
              <label for="display" class="form-label visually-hidden">Visor da calculadora</label>
              <input
                id="display"
                type="text"
                class="form-control form-control-lg text-end"
                placeholder="0"
                readonly
                aria-live="polite"
              />
            </div>
            <div class="calculator__grid">
              <button
                type="button"
                class="btn calculator__key calculator__key--control calculator__key--span-2"
                data-type="acao"
                data-value="c"
              >
                C
              </button>
              <button
                type="button"
                class="btn calculator__key calculator__key--operator"
                data-type="acao"
                data-value="/"
                aria-label="Dividir"
              >
                ÷
              </button>
              <button
                type="button"
                class="btn calculator__key calculator__key--operator"
                data-type="acao"
                data-value="*"
                aria-label="Multiplicar"
              >
                ×
              </button>
              <button type="button" class="btn calculator__key" data-type="valor" data-value="7">7</button>
              <button type="button" class="btn calculator__key" data-type="valor" data-value="8">8</button>
              <button type="button" class="btn calculator__key" data-type="valor" data-value="9">9</button>
              <button
                type="button"
                class="btn calculator__key calculator__key--operator"
                data-type="acao"
                data-value="-"
                aria-label="Subtrair"
              >
                −
              </button>
              <button type="button" class="btn calculator__key" data-type="valor" data-value="4">4</button>
              <button type="button" class="btn calculator__key" data-type="valor" data-value="5">5</button>
              <button type="button" class="btn calculator__key" data-type="valor" data-value="6">6</button>
              <button
                type="button"
                class="btn calculator__key calculator__key--operator"
                data-type="acao"
                data-value="+"
                aria-label="Somar"
              >
                +
              </button>
              <button type="button" class="btn calculator__key" data-type="valor" data-value="1">1</button>
              <button type="button" class="btn calculator__key" data-type="valor" data-value="2">2</button>
              <button type="button" class="btn calculator__key" data-type="valor" data-value="3">3</button>
              <button
                type="button"
                class="btn calculator__key calculator__key--equals"
                data-type="acao"
                data-value="="
                aria-label="Calcular resultado"
              >
                =
              </button>
              <button
                type="button"
                class="btn calculator__key calculator__key--span-2"
                data-type="valor"
                data-value="0"
              >
                0
              </button>
              <button
                type="button"
                class="btn calculator__key"
                data-type="acao"
                data-value="."
                aria-label="Ponto decimal"
              >
                ,
              </button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
